<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>縦書き表示アプリ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>縦書き表示アプリ</h1>

  <div class="container">
    <!-- 入力エリア -->
    <div class="input-section">
      <h2>テキスト入力</h2>
      <textarea id="text-input" placeholder="ここに文字を入力してください..."></textarea>
    </div>

    <!-- 表示エリア -->
    <div class="output-section">
      <h2>縦書き表示</h2>
      <div id="text-output" class="vertical-text"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
