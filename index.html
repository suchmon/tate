<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>縦書き表示アプリ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>縦書き表示</h1>
    </header>

    <!-- メイン：縦書き表示エリア（上） -->
    <main class="output-section">
      <div id="text-output" class="vertical-text"></div>
    </main>

    <!-- サブ：テキスト入力エリア（下） -->
    <footer class="input-section">
      <textarea id="text-input" placeholder="ここに文字を入力すると上に縦書きで表示されます..."></textarea>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
